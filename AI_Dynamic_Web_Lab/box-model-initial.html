<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model & Display Lab</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background: #f5f5f5; }
.controls, .stage { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
.control { margin: 12px 0; }
label { display: inline-block; width: 150px; }
#box1 {
    width: 220px;
    padding: 20px;
    margin: 20px;
    border: 5px solid #333;
    background:
        linear-gradient(#bde0fe, #bde0fe) content-box,
        linear-gradient(#caffbf, #caffbf) padding-box;
    background-clip: content-box, padding-box;
    box-shadow: 0 0 0 20px #ffd6a5;
}
#box2 { display: inline-block; padding: 20px; background: #ddd; }
</style>
</head>
<body>
<h1>Box Model & Display Interactive Lab</h1>

<div class="controls">
    <div class="control"><label>Padding: <span id="paddingValue">20px</span></label><input id="padding" type="range" min="0" max="60" value="20"></div>
    <div class="control"><label>Margin: <span id="marginValue">20px</span></label><input id="margin" type="range" min="0" max="60" value="20"></div>
    <div class="control"><label>Border: <span id="borderValue">5px</span></label><input id="border" type="range" min="0" max="20" value="5"></div>
    <div class="control"><label>Width: <span id="widthValue">220px</span></label><input id="width" type="range" min="80" max="500" value="220"></div>
    <div class="control">
        <label for="display">Display:</label>
        <select id="display">
            <option>block</option>
            <option>inline-block</option>
            <option>inline</option>
        </select>
    </div>
</div>

<div class="stage">
    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>
</div>

<script>
const box = document.getElementById("box1");

function bind(id, property) {
    const input = document.getElementById(id);
    const output = document.getElementById(id + "Value");

    input.addEventListener("input", () => {
        box.style[property] = input.value + "px";
        output.textContent = input.value + "px";

        if (id === "margin") {
            box.style.boxShadow = `0 0 0 ${input.value}px #ffd6a5`;
        }
    });
}

bind("padding", "padding");
bind("margin", "margin");
bind("border", "borderWidth");
bind("width", "width");

document.getElementById("display").addEventListener("change", e => {
    box.style.display = e.target.value;
});
</script>
</body>
</html>
