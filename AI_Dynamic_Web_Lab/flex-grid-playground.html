<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox & Grid Playground</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f4; }
.controls, #container { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 15px; }
label { display: flex; flex-direction: column; gap: 5px; }
#container { min-height: 280px; border: 2px dashed #777; }
.item { padding: 25px; border: 1px solid #555; background: #ddd; text-align: center; }
</style>
</head>
<body>
<h1>Visualizing Flexbox and Grid</h1>

<div class="controls">
<label>Display
<select id="display">
<option value="block">block</option>
<option value="flex">flex</option>
<option value="grid">grid</option>
</select>
</label>

<label>Flex Direction
<select id="flexDirection">
<option value="row">row</option>
<option value="column">column</option>
</select>
</label>

<label>Justify Content
<select id="justifyContent">
<option value="flex-start">flex-start</option>
<option value="center">center</option>
<option value="flex-end">flex-end</option>
<option value="space-between">space-between</option>
<option value="space-around">space-around</option>
<option value="space-evenly">space-evenly</option>
</select>
</label>

<label>Align Items
<select id="alignItems">
<option value="stretch">stretch</option>
<option value="flex-start">flex-start</option>
<option value="center">center</option>
<option value="flex-end">flex-end</option>
</select>
</label>

<label>Grid Template Columns
<select id="gridTemplateColumns">
<option value="1fr">1fr</option>
<option value="1fr 1fr">1fr 1fr</option>
<option value="1fr 1fr 1fr">1fr 1fr 1fr</option>
<option value="repeat(5, 1fr)">5 equal columns</option>
</select>
</label>
</div>

<div id="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    <div class="item">Item 4</div>
    <div class="item">Item 5</div>
</div>

<script>
const container = document.getElementById("container");

const mappings = {
    display: "display",
    flexDirection: "flexDirection",
    justifyContent: "justifyContent",
    alignItems: "alignItems",
    gridTemplateColumns: "gridTemplateColumns"
};

Object.entries(mappings).forEach(([id, property]) => {
    document.getElementById(id).addEventListener("change", e => {
        container.style[property] = e.target.value;
    });
});
</script>
</body>
</html>
